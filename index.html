<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset ="UTF-8">
        <title> HO5 ArchersHub</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="styles/styles.css">
    </head>

    <body class ="bg-light">
        <header class="text-center my-5">
            <div class="container">
                <h1 class="fw-bold display-6"> H05 ArchersHub</h1>
                <p class="text-muted">Lean Gutierrez CCAPDEV SS1</p>
            </div>
        </header>

        <main class="container mb-5">
            <div class="row g-4">
                <div class="col-lg-4 col-md-6">
                    <div class="card shadow-sm h-100 border-0 rounded-3">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title fw-bold text-dark mb-1"> Special Class Requests</h5>
                            <p class="card-subtitle text-muted fs-7 mb-3">Application Processing Pipeline</p>
                            <div class="chart-container flex-grow-1">
                                <canvas id="funnelChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4 col-md-6">
                    <div class="card shadow-sm h-100 border-0 rounded-3">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title fw-bold text-dark mb-1">Class Assessment Breakdown</h5>
                            <p class="card-subtitle text-muted fs-7 mb-3">Average Score per Category</p>
                            <div class="chart-container flex-grow-1">
                                <canvas id="radarChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4 col-md-12">
                    <div class="card shadow-sm h-100 border-0 rounded-3">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title fw-bold text-dark mb-1">Enrollment Volume</h5>
                            <p class="card-subtitle text-muted fs-7 mb-3">Peak Activity By Time Slot</p>
                            <div class="chart-container flex-grow-1">
                                <canvas id="polarChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div> 
            </div>
        </main>
        <!-- Chart.js -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="scripts/scripts.js"></script>
    </body>
</html>
